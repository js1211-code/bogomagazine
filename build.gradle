plugins {
    id 'java'
}

group = 'com.bogomagazine'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // testdata/private 의 로컬 샘플이 바뀌면 캐시된 결과를 쓰지 않고 다시 돌린다 (폴더가 없어도 된다)
    inputs.files(fileTree('testdata'))
}

// 사진 폴더 -> 엔진 입력 JSON: ./gradlew photoInput --args="<사진 폴더> [옵션]"  (옵션은 --args="--help" 가 아니라 소스의 USAGE 참고)
tasks.register('photoInput', JavaExec) {
    group = 'application'
    description = '사진 폴더에서 조판 엔진 입력(input.json)을 만든다'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bogomagazine.modules.layout.tools.InputFromPhotos'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
