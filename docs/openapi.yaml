openapi: 3.0.3
info:
  title: 보고매거진 API
  version: 0.1.0
  description: |
    가족이 올린 글/사진을 모아 월간 신문으로 만들어 인쇄·배송하는 서비스의 API.

    **최종본 — 내 쪽 API(가족/운영 전반)와 조아영님의 조판 API 설계(2026-10-06,
    "조판 API 설계 트레이드오프와 선정 이유")를 합쳤다.** 조판 워커(`claim_compose_job` 등
    DB 함수 기반 임대 큐)와 조판 엔진 `compose()` 자체는 HTTP API가 아니라서 이 문서에 없다 —
    대신 운영자가 그 결과를 다루는 엔드포인트(조판 검수·재조판·발송)는 전부 포함한다.
    조판 내부 상태(phase: COLLECTING/CLOSED/COMPOSING/COMPOSE_FAILED/IN_REVIEW/SENT)는
    DB의 `issue.status`보다 세분화되어 있고, 서버가 표시 상태(displayState)로 매핑해 내려준다.

    각 엔드포인트 설명에는 가능하면 기능명세서 코드(`FAM-01` 같은 것)를 같이 적었다. DB 설계는
    [architecture.md](architecture.md)/[erd.md](erd.md) 참고. 스키마와 이 문서가 다르면 **스키마가 기준**이다.

    ## 인증
    - 가족 사용자: 카카오/애플 로그인 후 발급되는 `Bearer` 토큰 (`userBearer`)
    - 운영자(Admin): 별도 로그인으로 발급되는 `Bearer` 토큰 (`operatorBearer`). 로그인 방식(사내 계정 체계) 자체는
      스펙에 구체적으로 정해지지 않아 이 문서에서는 이메일/비밀번호로 가정만 해뒀다 — 팀 확인 필요.

    ## 공통 규칙
    - 모든 시각은 ISO 8601(UTC, `Z` 표기), 날짜(`period_start` 등)는 `YYYY-MM-DD`.
    - 목록 응답은 `{ "items": [...], "nextCursor": "..." }` 형태의 커서 페이지네이션.
    - 삭제는 대부분 소프트 삭제(해당 리소스는 설명에 명시). DELETE 응답은 204.
    - 에러 응답은 전부 `Error` 스키마.

servers:
  - url: https://bogomagazine.example/api/v1
    description: 운영 (도메인 미정)
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

tags:
  - name: Auth
    description: 로그인/로그아웃/탈퇴 (ACC-01~05)
  - name: Me
    description: 내 프로필/동의/차단 (PRF-01, ACC-03, SAFE-02)
  - name: Devices
    description: 푸시 토큰
  - name: Notifications
    description: "알림 목록 (NOTI-01~06, 1004 결정)"
  - name: Waitlist
    description: 정식 출시 대기 신청 (WAIT-01)
  - name: Groups
    description: 가족 그룹 (FAM-01~04)
  - name: Members
    description: 구성원 (FAM-08~13)
  - name: Invites
    description: 카카오톡 초대 링크 (FAM-05~07)
  - name: DeliveryAddress
    description: 수신자 정보/배송지 (RCV-01~03)
  - name: Issues
    description: 호 상태/진행 (가족 쪽 읽기 전용, PUB-01)
  - name: Feed
    description: 글/사진 (POST-01~07)
  - name: Questions
    description: 질문카드 (QST-01~07)
  - name: Comments
    description: 답변 댓글 (QST-06)
  - name: Reports
    description: 신고 (SAFE-01)
  - name: Newsletter
    description: 발송된 신문 PDF 열람 (PUB-02, M-12)
  - name: AdminAuth
    description: 운영자 로그인
  - name: AdminIssues
    description: 운영자용 호 운영 (ADM-02)
  - name: AdminCompose
    description: "조판 검수/재조판/발송 완료/인쇄 PDF·배송지 (ADM-02~04, 조아영 조판 API 설계 반영) — 조판 엔진 자체는 제외, 결과에 대한 조치만"
  - name: AdminReports
    description: 신고·차단 처리 (ADM-05)
  - name: AdminMetrics
    description: 평가 지표 (ADM-06)
  - name: AdminWaitlist
    description: 대기 신청 목록 (ADM-07)
  - name: AdminAlerts
    description: 운영 알림 (ADM-08)

security:
  - userBearer: []

paths:
  # ===================== Auth / Me =====================
  /auth/kakao:
    post:
      tags: [Auth]
      summary: 카카오 로그인 (ACC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kakaoAccessToken]
              properties:
                kakaoAccessToken: { type: string }
                inviteToken: { type: string, description: "초대 링크로 들어온 경우(FAM-07)" }
                consent:
                  $ref: "#/components/schemas/SignupConsent"
      responses:
        "200":
          description: 로그인 성공 (최초 로그인이면 가입도 함께 처리됨)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: 최초 가입인데 필수 동의(consent)가 빠짐(ACC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/apple:
    post:
      tags: [Auth]
      summary: 애플 로그인 (ACC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appleIdentityToken]
              properties:
                appleIdentityToken: { type: string }
                name: { type: string, description: "애플은 최초 로그인 때만 제공" }
                inviteToken: { type: string }
                consent:
                  $ref: "#/components/schemas/SignupConsent"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: 최초 가입인데 필수 동의(consent)가 빠짐(ACC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃 (ACC-04)
      responses:
        "204": { description: 로그아웃됨 }

  /me:
    get:
      tags: [Me]
      summary: 내 프로필 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Me]
      summary: 내 프로필 수정 (PRF-01)
      description: "사진은 받지 않는다(1005 결정) — 앱 아바타·지면 표기는 캐릭터(PRF-05)로 대체 예정이나 설계 미확정이라 아직 API에 없다."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                birthMonth: { type: integer, minimum: 1, maximum: 12 }
                birthDay: { type: integer, minimum: 1, maximum: 31 }
                researchConsented: { type: boolean, description: "연구·발표 활용 동의(선택, ACC-03)" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Me]
      summary: 회원 탈퇴 (ACC-05)
      description: |
        신원/인증 정보를 익명화한다. 모집 중인 호의 글은 삭제되고, 마감 이후 호의 글은 유지된다.
        방장이면 다른 활동 중인 구성원에게 자동으로 방장이 넘어간다(FAM-11). 혼자뿐인 그룹의 방장은
        아직 거부된다(정책 미정, TODO.md "결정 대기").
      responses:
        "204": { description: 탈퇴 완료 }
        "409":
          description: 혼자뿐인 그룹의 방장이라 탈퇴 불가
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/devices:
    post:
      tags: [Devices]
      summary: 푸시 토큰 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                platform: { type: string, enum: [ios, android] }
                pushToken: { type: string }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }

  /me/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: 푸시 토큰 해지 (로그아웃/재설치 시)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { description: 해지됨 }

  /me/notifications:
    get:
      tags: [Notifications]
      summary: "알림 목록 (NOTI-06, 1004 결정)"
      description: |
        소속된 모든 가족의 알림을 가족 이름과 함께 시간순으로 보여준다. 종류: 질문 공개(NOTI-01)·
        마감 리마인더(NOTI-02)·발송 완료(NOTI-03)·방장 변경(FAM-11). 60일 지나면 자동 삭제된다(O-33).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /me/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: "알림 읽음 표시 (NOTI-06)"
      description: 목록을 열면 안 읽은 항목의 배경색이 사라진다.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: 읽음 표시됨 }

  /me/blocks:
    get:
      tags: [Me]
      summary: "내가 차단한 사람 목록 (SAFE-02, HOME-04 설정 화면)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserBlock" }

  /users/{userId}/block:
    post:
      tags: [Me]
      summary: 개인 차단 (SAFE-02)
      description: 차단하면 내 화면에서 그 사람 콘텐츠가 숨겨지고, 자동으로 팀에 신고가 쌓인다. 상대에게 알림 없음.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 차단됨 }
        "409":
          description: 자기 자신을 차단하려 함 / 이미 차단함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Me]
      summary: "개인 차단 해제 (SAFE-02, 설정 '내가 차단한 사람', 1004 결정)"
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 해제됨 }

  /waitlist:
    post:
      tags: [Waitlist]
      summary: 정식 출시 대기 신청 (WAIT-01)
      description: "계정 단위로 한 번만 신청 가능(가족방마다가 아님). `GET /groups/{groupId}/waitlist-status`로 노출 조건·신청 여부를 먼저 확인한다."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, default: "WAIT-01" }
      responses:
        "201": { description: 신청됨 }
        "409": { description: 같은 코드로 이미 신청함 }

  /groups/{groupId}/waitlist-status:
    get:
      tags: [Waitlist]
      summary: 대기 신청 노출 조건·신청 여부 확인 (WAIT-01)
      description: |
        노출 조건: 다음 회차 구독이 없는 가족의 마지막 호가 발송 완료된 때부터 노출. 다음 호가
        이어지면 지난 호가 되어 노출하지 않는다(1005 결정). `eligible`은 이 조건을, `applied`는
        계정 전체 기준 신청 여부를 돌려준다 — 클라이언트가 호 목록을 보고 직접 계산하지 않게 한다.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  applied: { type: boolean }

  # ===================== Groups / Members / Invites =====================
  /groups:
    get:
      tags: [Groups]
      summary: 내가 속한 가족 그룹 목록 (FAM-04)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyGroup" }
    post:
      tags: [Groups]
      summary: 가족 그룹 만들기 (FAM-01)
      description: |
        만든 사람이 방장이 된다. 그룹 이름(FAM-02), 내 관계(PRF-02), 수신자 정보(RCV-01),
        배송지(RCV-02)를 한 번에 입력한다. 신문 제호(FAM-03)는 기본값 '보고잡지'.

        **중복 생성 방지(1005 결정, 프로토타입 수준)**: 같은 사람이 방금(수 초 이내) 같은 이름으로
        만든 가족방이 있으면 새로 만들지 않고 그 가족방을 그대로 반환한다(200). 네트워크 오류로
        [다시 시도]를 눌러도 가족방이 중복 생성되지 않게 하려는 것 — 요청이 느려지거나 응답을 못
        받아도 안전하게 재시도할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, relationship, deliveryAddress]
              properties:
                name: { type: string, description: "그룹 이름(FAM-02)" }
                newsletterTitle: { type: string, default: "보고잡지", description: "신문 제호(FAM-03)" }
                relationship: { $ref: "#/components/schemas/Relationship" }
                deliveryAddress: { $ref: "#/components/schemas/DeliveryAddressInput" }
      responses:
        "200":
          description: 방금 같은 내용으로 만든 가족방이 이미 있어 그걸 그대로 반환함 (중복 생성 방지)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
        "201":
          description: 새로 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: 그룹 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
    patch:
      tags: [Groups]
      summary: 그룹 이름/제호 수정 (FAM-02, FAM-03)
      description: |
        `name`(그룹 이름)은 **방장만** 수정 가능하다(FAM-02, FAM-08). `newsletterTitle`(신문 제호)은
        변경 권한이 아직 미결(O-14)이라 지금은 구성원 누구나 가능 — 확정되면 방장 전용으로 좁혀야 한다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "방장만(FAM-02)" }
                newsletterTitle: { type: string, description: "구성원 누구나(O-14 미결)" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
        "403":
          description: "방장이 아닌 사용자가 name을 바꾸려 함"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Members]
      summary: 구성원 목록 (FAM-13)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyMember" }

  /groups/{groupId}/members/me:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    patch:
      tags: [Members]
      summary: 내 관계(호칭) 수정 (PRF-02)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [relationship]
              properties:
                relationship: { $ref: "#/components/schemas/Relationship" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMember" }

  /groups/{groupId}/members/{userId}:
    delete:
      tags: [Members]
      summary: 구성원 내보내기 (FAM-09, 방장만)
      description: 내보낸 계정은 자동으로 '내보낸 구성원' 목록에 등록된다. 방장은 내보낼 수 없다.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 내보냄 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 방장을 내보내려 함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/removed-members:
    get:
      tags: [Members]
      summary: 내보낸 구성원 목록 (FAM-09/10, 방장만)
      description: |
        개인 차단(`/me/blocks`, SAFE-02)과는 다른 기능이다 — 이름이 "차단"으로 겹치지 않도록
        FAM-09 용어("내보낸 구성원")를 그대로 경로에 썼다(조아영 조판 API 설계 제안 반영).
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyBlock" }

  /groups/{groupId}/removed-members/{userId}/allow-rejoin:
    post:
      tags: [Members]
      summary: 재합류 허용 (FAM-10, 방장만)
      description: 허용하면 같은 초대 링크로 다시 합류 가능.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 재합류 허용됨 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/invite-link:
    get:
      tags: [Invites]
      summary: 초대 링크 조회 (FAM-05, 구성원 누구나)
      description: |
        유효기간·사용 횟수 제한·취소가 없는 영구 링크다. **가족마다 고정 코드 1개**(1005 결정).
        없으면 서버가 그 자리에서 만들어(방장 명의로) 돌려준다 — "구성원 누구나 공유 가능"(FAM-08)
        이라 생성 동작을 방장 전용 POST로 따로 둘 필요가 없다(조아영 조판 API 설계 제안 반영,
        이름이 POST .../invites에서 GET .../invite-link로 바뀜).
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK (처음 조회한 사람이 있으면 그 시점에 만들어짐)
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl: { type: string, format: uri }

  /invites/{token}:
    get:
      tags: [Invites]
      summary: "초대 링크 미리 확인 (FAM-07 \"우리 가족 확인\")"
      description: "로그인 전 화면. 가족방 이름·받는 분·참여 중인 가족 구성원을 보여준다(FAM-07)."
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 가족방 이름, 받는 분, 참여 중인 구성원 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupName: { type: string }
                  recipientNames: { type: array, items: { type: string }, description: "1인이면 1개, 부부면 2개" }
                  members:
                    type: array
                    description: "참여 중인 가족 구성원(FAM-07 \"참여 중인 가족\"). 캐릭터는 설계 미확정이라 아직 없음"
                    items:
                      type: object
                      properties:
                        nickname: { type: string, nullable: true }
                  memberCount: { type: integer, description: "members.length와 같음 — 개수만 필요한 화면용" }
        "403":
          description: 차단된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invites/{token}/accept:
    post:
      tags: [Invites]
      summary: 초대 수락 (FAM-05~07)
      description: 이미 활동 중인 구성원이면 그대로 합류 처리, 나갔던 구성원이면 재합류. 항상 일반 구성원.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 합류됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
        "403":
          description: 차단된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/recipients:
    get:
      tags: [DeliveryAddress]
      summary: 받는 분 이름 목록 (RCV-01, 구성원 누구나)
      description: |
        배송지(우편번호·주소·전화번호)는 빼고 이름만 준다 — "구성원 누구나: 수신자 이름·캐릭터
        보기"(FAM-08)는 되지만 주소 조회·수정은 방장만 가능(RCV-02)이라 둘을 분리했다. 캐릭터는
        설계 미확정이라 아직 없음.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        displayOrder: { type: integer, enum: [1, 2] }

  /groups/{groupId}/delivery-address:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [DeliveryAddress]
      summary: 수신자 정보/배송지 전체 조회 (RCV-01/02, 방장만)
      description: "주소·전화번호 등 배송지 전체를 포함한다. 이름만 필요하면 구성원 누구나 쓸 수 있는 `GET /groups/{groupId}/recipients`를 쓴다."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }
    put:
      tags: [DeliveryAddress]
      summary: 수신자 정보/배송지 등록·수정 (RCV-01/02, 방장만)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryAddressInput" }
      responses:
        "200":
          description: 저장됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }

  # ===================== Issues (family-facing, read-only) =====================
  /groups/{groupId}/home:
    get:
      tags: [Issues]
      summary: "공유 헤더 홈 읽기 모델 (HOME-01~06, 조아영 조판 API 설계 제안으로 신설)"
      description: |
        상태 줄(HOME-02)·질문카드(HOME-01)·알림 표시를 앱 실행/가족 전환마다 한 번에 받기 위한
        합성 엔드포인트. 그때그때 `GET /groups/{groupId}/issues/current` +
        `GET /groups/{groupId}/questions` + `GET /me/notifications`를 따로 부르는 대신
        한 번의 호출로 묶는다.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: "#/components/schemas/Issue" }
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
                  unreadNotificationCount: { type: integer }

  /groups/{groupId}/issues:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Issues]
      summary: 호 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }

  /groups/{groupId}/issues/current:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Issues]
      summary: "이번 호 상태/진행 (HOME-01 D-day, PUB-01)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}:
    get:
      tags: [Issues]
      summary: 호 상세
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  # ===================== Feed =====================
  /groups/{groupId}/feed:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Feed]
      summary: 피드 조회 (HOME-02/03, 시간순)
      description: |
        '할머니께만' 게시물은 작성자 외 다른 구성원에게는 보이지 않는다.
        issueId를 생략하면 이번 호, 지정하면 지난 호를 읽기 전용으로 조회한다(HOME-03, 1004 결정).
      parameters:
        - name: issueId
          in: query
          schema: { type: string, format: uuid }
          description: "생략하면 이번 호. 지난 호 지정 시 읽기 전용(HOME-03)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }

  /groups/{groupId}/posts:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    post:
      tags: [Feed]
      summary: 글 작성 (POST-01)
      description: 마감된 기간에는 거부된다. 작성자는 그 그룹의 활동 중인 구성원이어야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "422":
          description: 마감된 기간 / 금칙어 포함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Feed]
      summary: 글 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
    patch:
      tags: [Feed]
      summary: 글 수정 (POST-06, 본인만·마감 전까지만)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 수정 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Feed]
      summary: 글 삭제 (POST-06, 본인만·마감 전까지만, 소프트 삭제)
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 삭제 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /uploads/presign:
    post:
      tags: [Feed]
      summary: 사진 업로드용 presigned URL 발급 (NFR-03, POST-07 마감 유예)
      description: |
        글(post)보다 업로드가 먼저 시작되는 구조라 `/posts/{postId}/media`가 아니라 독립
        경로로 둔다(조아영 조판 API 설계 제안 반영, 원래 `/media/{mediaId}/upload-url`).
        **`initiatedAt`은 이 호출 시각으로 서버가 기록**한다 — 마감 유예(POST-07, 마감 후 14분)
        판정에 쓰이는 값이라 클라이언트가 조작할 수 없게 서버 발급 시각을 기준으로 삼는다
        (조아영 조판 API 설계에서 지적한 문제: 기존에는 이 값을 클라이언트가 그대로 보냈음).
        발급된 `uploadId`는 `POST /posts/{postId}/media` 등록 때 그대로 돌려준다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256: { type: string, description: "미리 알면 중복 업로드를 건너뛸 수 있음(선택)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  initiatedAt: { type: string, format: date-time, description: "서버가 기록한 업로드 시작 시각" }
                  expiresAt: { type: string, format: date-time }

  /posts/{postId}/media:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Feed]
      summary: 사진 첨부 (POST-05)
      description: "`POST /uploads/presign`으로 직접 업로드한 뒤 그 결과를 등록한다. `initiatedAt`은 서버가 `uploadId`로 조회해 채우므로 요청 본문에는 없다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, storageKey, sha256, width, height]
              properties:
                uploadId: { type: string, format: uuid, description: "POST /uploads/presign 이 발급한 값" }
                storageKey: { type: string }
                sha256: { type: string }
                width: { type: integer }
                height: { type: integer }
                takenAt: { type: string, format: date-time }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "422":
          description: "uploadId가 없거나 만료됨"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /media/{mediaId}:
    delete:
      tags: [Feed]
      summary: 사진 삭제 (NFR-11 소프트 삭제, 그 글의 작성자만·마감 전까지만)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 삭제 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===================== Questions / Comments / Reports =====================
  /groups/{groupId}/questions:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Questions]
      summary: 공개된 질문 목록 (QST-01, 보통 2개)
      description: |
        `issueId`를 생략하면 이번 호, 지정하면 그 호에 공개됐던 질문 목록을 돌려준다(`GET
        .../feed`와 같은 패턴). HOME-05: 호 목록에서 지난 호를 고르면 소식·질문카드 탭이 함께
        그 호로 바뀌어야 하므로, 지난 호의 질문도 조회할 수 있어야 한다.
      parameters:
        - name: issueId
          in: query
          schema: { type: string, format: uuid }
          description: "생략하면 이번 호. 지난 호 지정 시 그 호에 공개됐던 질문 목록(읽기 전용)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }

  /groups/{groupId}/questions/{questionId}/answer:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: questionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Questions]
      summary: 질문 답변 작성/수정 (QST-03/04)
      description: |
        1인당 질문당 답변은 항상 1개뿐이라 멱등 PUT 하나로 생성·수정을 겸한다(조아영 조판 API
        설계 제안 반영 — 원래 POST /groups/{groupId}/answers로 만들고 PATCH /posts/{postId}로
        고치던 것을 하나로 합침). 처음 호출하면 생성(201), 이미 답변이 있으면 그 내용을
        바꾼다(200). 마감 전까지만 가능(QST-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionOption: { type: string, description: "선택형 질문의 선택지. 주관식은 생략" }
                body: { type: string, description: "한 줄 덧붙이기(선택) 또는 주관식 답" }
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "200":
          description: 기존 답변이 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "201":
          description: 새로 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "422":
          description: 마감된 기간 / 금칙어 포함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Questions]
      summary: 답변 삭제 (QST-04, 본인만·마감 전까지만, 소프트 삭제)
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 삭제 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/questions/{questionId}/answers:
    get:
      tags: [Questions]
      summary: 그 질문에 대한 가족 답변 목록 (QST-05)
      description: |
        내가 답변하지 않았으면 답변 내용은 숨기고, 누가 답했고 누가 아직 안 했는지만 보여준다
        (1005 결정 — 식탁 그림 컨셉, 구성원을 캐릭터로 구분해 표시. 캐릭터 필드는 설계 미확정이라
        아직 응답에 없음). '할머니께만' 답변과 내가 개인 차단(SAFE-02)한 사람은 두 목록 모두에서
        제외된다. 독촉 의도의 알림은 보내지 않는다(NOTI-04).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      answered: { type: boolean, enum: [false] }
                      respondedMembers:
                        type: array
                        items: { $ref: "#/components/schemas/MemberSummary" }
                      pendingMembers:
                        type: array
                        items: { $ref: "#/components/schemas/MemberSummary" }
                  - type: object
                    properties:
                      answered: { type: boolean, enum: [true] }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Post" }

  /answers/{answerId}/comments:
    parameters:
      - name: answerId
        in: path
        required: true
        description: "질문 답변인 게시물의 id(= post.id). 자유 게시물은 허용되지 않는다"
        schema: { type: string, format: uuid }
    post:
      tags: [Comments]
      summary: 답변 댓글 작성 (QST-06)
      description: |
        질문 답변에만 허용(자유 게시물 거부, 경로 이름으로도 드러냄 — 조아영 조판 API 설계
        제안 반영, 원래 /posts/{postId}/comments). 마감 후 불가.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "422":
          description: 자유 게시물에 댓글 시도 / 마감 후
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Comments]
      summary: 댓글 수정 (QST-06, 본인만·마감 전까지만)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Comments]
      summary: 댓글 삭제 (QST-06, 본인만·마감 전까지만, 소프트 삭제)
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports:
    post:
      tags: [Reports]
      summary: 콘텐츠 신고 (SAFE-01)
      description: 신고한 사람 화면에서는 즉시 숨김 처리(클라이언트에서 처리).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [post, comment] }
                targetId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "201":
          description: 접수됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  # ===================== Newsletter (발송 후 열람) =====================
  /issues/{issueId}/newsletter:
    get:
      tags: [Newsletter]
      summary: 발송 완료된 신문의 열람용 페이지 이미지 목록 (PUB-02, NEWS-01)
      description: |
        인쇄용 PDF가 아니라 서버가 따로 만든 **열람용 페이지 이미지**(면마다 1장, '할머니께만' 블러를
        서버에서 입힌 것, 작성자 본인에게도 블러)를 돌려준다. 앱은 이 이미지를 책처럼 한 면씩 넘겨
        보여준다(리플로우 없음, 종이 지면과 같은 모양). 발송 완료 전에는 409(NOT_SENT) — 호는 존재하지만
        아직 열람할 수 없는 상태라 404(리소스 없음)보다 409가 맞다. 다운로드·공유는 제공하지
        않는다(앱 안에서만 보기). **호출할 때마다 열람 기록이 자동으로 남는다(M-12, 멱등 아님)** —
        별도 view 엔드포인트는 두지 않는다. 앱이 빠뜨리거나 중복 호출하면 지표가 어긋나므로 조회
        자체에 기록을 묶었다.
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: string, format: uuid }
                  pageCount: { type: integer }
                  pages:
                    type: array
                    description: "pageNo 순서대로"
                    items:
                      type: object
                      properties:
                        pageNo: { type: integer }
                        imageUrl: { type: string, format: uri, description: "만료되는 서명 URL(NFR-08)" }
                  expiresAt: { type: string, format: date-time, description: "imageUrl 공통 만료 시각" }
        "409":
          description: "아직 발송 완료 전 (NOT_SENT)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===================== Admin =====================
  /admin/auth/login:
    post:
      tags: [AdminAuth]
      summary: 운영자 로그인
      description: "인증 방식은 스펙에 구체적으로 정해지지 않음 — 이메일/비밀번호로 가정만 해둠(팀 확인 필요)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  operator: { $ref: "#/components/schemas/Operator" }

  /admin/me:
    get:
      tags: [AdminAuth]
      summary: 현재 운영자 정보
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }

  /admin/issues:
    get:
      tags: [AdminIssues]
      summary: 전체 가족방의 호 상태 목록 (ADM-02)
      description: "`phase`(내부 상태, 세분화)와 `reviewed`(검수 마커) 조합으로 필터링. 목록은 `displayState`도 함께 내려준다."
      security: [{ operatorBearer: [] }]
      parameters:
        - name: phase
          in: query
          schema: { $ref: "#/components/schemas/IssuePhase" }
        - name: reviewed
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }

  /admin/issues/{issueId}:
    get:
      tags: [AdminIssues]
      summary: 호 상세 (ADM-02) — 최신 조판 실행, 인쇄 작업, 검수 마커
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /admin/issues/{issueId}/pdf:
    get:
      tags: [AdminCompose]
      summary: 가족별 인쇄용 PDF 서명 URL (ADM-03/04)
      description: "`IN_REVIEW` 상태에서만 제공된다 (조판·블러 적용까지 끝난 결과)."
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdfUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  runNo: { type: integer }
                  status: { type: string, enum: [DONE] }
        "409":
          description: "호가 IN_REVIEW가 아님 (NOT_IN_REVIEW)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/issues/{issueId}/recompose:
    post:
      tags: [AdminCompose]
      summary: "게시물 제외 후 다시 만들기 (ADM-03)"
      description: |
        제외는 그 호의 신문에서만 빠진다 — 가족 피드의 원본 게시물은 그대로 남는다.
        이전 조판 실행(run)은 superseded로 보존되고 새 run이 큐에 오른다(내부 상태 IN_REVIEW → COMPOSING).
        재조판 횟수에 별도 상한은 없다.
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [excludePostIds]
              properties:
                excludePostIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                note: { type: string, nullable: true }
      responses:
        "200":
          description: 다시 만들기 큐에 올라감 (완료까지 기다리지 않고 즉시 응답 — 운영자가 호 상세를 다시 조회해 진행 확인)
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: string, format: uuid }
                  phase: { type: string, enum: [COMPOSING] }
                  excludedCount: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "호가 IN_REVIEW가 아님 (NOT_IN_REVIEW)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/issues/{issueId}/compose/retry:
    post:
      tags: [AdminCompose]
      summary: "조판 3회 실패 후 재시도 (ADM-03/08)"
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: 재시도 큐에 올라감
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetCount: { type: integer }
                  phase: { type: string, enum: [COMPOSING] }
        "409":
          description: "호가 COMPOSE_FAILED가 아님"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/issues/{issueId}/markers:
    patch:
      tags: [AdminCompose]
      summary: 검수 마커 표시 (ADM-03, 표시용·진행 추적용)
      description: |
        `reviewed`는 운영자가 직접 켜는 표시용 마커이고 발송 완료 전환의 필수 조건은 아니다
        (경고만 — `GET .../ship-check` 참고). 재조판하면 초기화된다. `printDownloaded`는
        `POST /admin/print/pdf-exports`에서 자동으로 파생되며 이 엔드포인트로는 바꿀 수 없다.
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewed]
              properties:
                reviewed: { type: boolean }
      responses:
        "200":
          description: 변경됨 (호 상태는 바뀌지 않음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueMarkers" }
        "409":
          description: "호가 IN_REVIEW가 아님 (NOT_IN_REVIEW)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/issues/{issueId}/ship-check:
    get:
      tags: [AdminCompose]
      summary: 발송 완료 사전 점검 (ADM-02)
      description: "필수 항목이 하나라도 걸리면 전환 불가. 경고 항목은 확인 후 그대로 전환 가능."
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  canShip: { type: boolean }
                  notifyCount: { type: integer, description: "발송 완료 전환 시 푸시 받을 활동 중인 구성원 수" }
                  blockers:
                    type: array
                    description: "필수 — NOT_IN_REVIEW/NO_READY_PDF/NO_CONTENT"
                    items: { type: string }
                  warnings:
                    type: array
                    description: "경고 — NOT_REVIEWED/PDF_NOT_DOWNLOADED"
                    items: { type: string }

  /admin/issues/{issueId}/ship:
    post:
      tags: [AdminCompose]
      summary: "발송 완료로 전환 (ADM-02)"
      description: |
        명세의 수동 전환은 이 엔드포인트 하나뿐이다(PUB-01). 전환은 되돌릴 수 없고(취소 없음 — 푸시가
        이미 나가면 돌이킬 수 없어서), 그래서 먼저 `GET .../ship-check`로 점검하고 `confirmed: true`로
        명시적으로 확인해야 한다. 전환하면 활동 중인 구성원 전원에게 발송완료 푸시(NOTI-03)가 간다.
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true] }
                note: { type: string, nullable: true }
      responses:
        "200":
          description: 전환됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueId: { type: string, format: uuid }
                  phase: { type: string, enum: [SENT] }
                  displayState: { type: string, enum: [SENT] }
                  changedAt: { type: string, format: date-time }
        "409":
          description: "필수 사전 점검 불통과 (SHIP_BLOCKED)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "경고 항목 확인 없이 전환 시도 (CONFIRMATION_REQUIRED)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/print/pdf-exports:
    post:
      tags: [AdminCompose]
      summary: 인쇄용 PDF 일괄 다운로드 (ADM-04, 인쇄소 전달용)
      description: |
        여러 호의 인쇄용 PDF를 zip으로 묶어 받는다. 각 호는 `IN_REVIEW`여야 하며(= 인쇄용 PDF가
        준비된 상태, `GET .../pdf`와 같은 사전조건), 하나라도 아니면 그 요청 전체를 거부한다(409).
        다운로드하면 그 호들의 `printDownloaded` 마커가 자동으로 켜진다(부작용이 있어 GET이 아니라
        POST). 배송 주문 상태(발송/추적)는 택배 API 연동이 없어(PUB-03) API로 추적하지 않는다 —
        배송지는 아래 엑셀로만 받는다.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueIds]
              properties:
                issueIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "issueIds 중 IN_REVIEW가 아닌 호가 있음 (NOT_IN_REVIEW)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/print/addresses.xlsx:
    get:
      tags: [AdminCompose]
      summary: 배송지 목록 엑셀 다운로드 (ADM-04, 팀이 직접 우편 발송)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: issueIds
          in: query
          required: true
          schema: { type: array, items: { type: string, format: uuid } }
          description: "쉼표로 구분된 호 id 목록. 배송지는 마감 시점 주소로 고정(RCV-02)"
      responses:
        "200":
          description: xlsx 파일
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /admin/reports:
    get:
      tags: [AdminReports]
      summary: 신고 목록 (ADM-05)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }

  /admin/reports/{reportId}:
    patch:
      tags: [AdminReports]
      summary: 신고 처리 (ADM-05, 24시간 안 대응)
      description: 처리하면 신고된 게시물/답변/댓글을 숨긴다.
      security: [{ operatorBearer: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved] }
                hideContent: { type: boolean, default: true }
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /admin/delivery-addresses/{groupId}:
    get:
      tags: [AdminReports]
      summary: 배송지 열람 (ADM-01)
      description: 열람·다운로드 기록이 남는다(delivery_address_access_log).
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }

  /admin/waitlist:
    get:
      tags: [AdminWaitlist]
      summary: 대기 신청 목록/수 (ADM-07)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        code: { type: string }
                        createdAt: { type: string, format: date-time }

  /admin/alerts:
    get:
      tags: [AdminAlerts]
      summary: 운영 알림 목록 (ADM-08)
      description: 신고 접수는 즉시, 조판 실패는 3번째 실패에서만 쌓인다.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorAlert" }

  /admin/metrics:
    get:
      tags: [AdminMetrics]
      summary: 평가 지표 (ADM-06, M-01~M-13)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: groupId
          in: query
          schema: { type: string, format: uuid }
          description: 생략하면 전체 집계
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }

  /admin/metrics/export:
    get:
      tags: [AdminMetrics]
      summary: 평가 지표 엑셀 내보내기 (ADM-06)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: xlsx 파일
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 없음 (본인/방장만 가능한 동작)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: "PERIOD_CLOSED" }
        message: { type: string }

    Relationship:
      type: string
      enum: [손녀, 손자, 딸, 아들, 며느리, 사위, 손주며느리, 손주사위]
      description: "호칭 대응표(TTL-01~04) 8개 값. 외가 구분 없음"

    Visibility:
      type: string
      enum: [all, recipient_only]
      default: all
      description: "POST-02. recipient_only = '할머니께만'"

    IssuePhase:
      type: string
      enum: [COLLECTING, CLOSED, COMPOSING, COMPOSE_FAILED, IN_REVIEW, SENT]
      description: |
        운영자 전용 내부 상태(세분화). DB `issue.status`보다 자세하다 — CLOSED/COMPOSING/COMPOSE_FAILED는
        전부 DB상 'closing'이지만 운영자는 구분해서 봐야 한다(조판 API 설계, 2026-10-06 확정).
        전이: COLLECTING → CLOSED → COMPOSING → IN_REVIEW → SENT, COMPOSING ↔ COMPOSE_FAILED(최대 3회),
        IN_REVIEW → COMPOSING(재조판). SENT는 되돌릴 수 없다.

    DisplayState:
      type: string
      enum: [COLLECTING, PRODUCING, SENT]
      description: |
        가족에게 보여주는 단순화된 상태(PUB-01, HOME-02). 모집 마감·조판·검수는 전부
        "신문 만드는 중"(PRODUCING)으로 합쳐 보여준다 — 자동 전환이라 사용자는 구분할 필요가 없다.

    IssueMarkers:
      type: object
      description: "운영자 검수 진행 추적용 표시 마커(ADM-03). 발송 완료 전환의 필수 조건은 아니다(경고만)."
      properties:
        reviewed: { type: boolean }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        printDownloaded: { type: boolean, description: "POST /admin/print/pdf-exports 로 다운로드하면 자동으로 켜짐" }
        printDownloadedAt: { type: string, format: date-time, nullable: true }

    LayoutRunSummary:
      type: object
      description: "조판 워커 실행 1회 요약 (DB layout_run). 운영자 전용"
      properties:
        runNo: { type: integer, description: "호별 조판 회차, 1부터" }
        attempt: { type: integer, description: "같은 회차 안에서의 재시도 횟수" }
        status: { type: string, enum: [queued, running, done, failed, superseded] }
        failureCode:
          type: string
          nullable: true
          enum: [input_invalid, no_content, timeout, render_failed, storage_error, worker_lost]
          description: "status=failed일 때만. input_invalid/no_content는 재시도해도 같은 결과라 자동 재시도 대상에서 빠진다"
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    PrintJobSummary:
      type: object
      description: "인쇄용 PDF 생성 작업 요약 (DB print_job). 운영자 전용"
      properties:
        status: { type: string, enum: [queued, rendering, preflight_failed, ready, failed] }
        pdfReady: { type: boolean, description: "status=ready와 동일(조회 편의용 — GET .../pdf, pdf-exports의 사전조건)" }
        createdAt: { type: string, format: date-time }

    SignupConsent:
      type: object
      description: |
        가입 동의(ACC-03). **최초 가입(isNewUser=true)일 때만 필수**다 — 이미 가입된 사용자가
        로그인할 때는 무시된다. 만 14세 미만이면 ageOver14Confirmed를 보낼 수 없게 앱이 막아야 한다
        (가입 자체를 차단).
      required: [privacyConsented, termsConsented, ageOver14Confirmed]
      properties:
        privacyConsented: { type: boolean, enum: [true], description: 개인정보 수집·이용 동의 }
        termsConsented: { type: boolean, enum: [true], description: "이용약관(불쾌한 콘텐츠·악용 사용자 무관용 조항) 동의" }
        ageOver14Confirmed: { type: boolean, enum: [true], description: 만 14세 이상 확인 }
        researchConsented: { type: boolean, default: false, description: "연구·발표 활용 동의(선택)" }

    AuthResult:
      type: object
      properties:
        accessToken: { type: string }
        isNewUser: { type: boolean }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        birthMonth: { type: integer, nullable: true }
        birthDay: { type: integer, nullable: true }
        privacyConsentedAt: { type: string, format: date-time }
        termsConsentedAt: { type: string, format: date-time }
        ageOver14ConfirmedAt: { type: string, format: date-time }
        researchConsentedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        createdAt: { type: string, format: date-time }

    FamilyGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        newsletterTitle: { type: string }
        ownerId: { type: string, format: uuid }
        closeDay: { type: integer, minimum: 1, maximum: 28 }
        timezone: { type: string, default: "Asia/Seoul" }
        createdAt: { type: string, format: date-time }

    FamilyMember:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        relationship: { $ref: "#/components/schemas/Relationship" }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }

    MemberSummary:
      type: object
      description: "QST-05 답변 전 식탁 그림 등 가벼운 목록에 쓰는 요약 정보. 캐릭터(PRF-05)는 설계 미확정이라 아직 없음"
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string, nullable: true }

    FamilyBlock:
      type: object
      properties:
        userId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: string, format: uuid, nullable: true, description: "방장 변경처럼 호와 무관한 알림도 있다" }
        issueId: { type: string, format: uuid, nullable: true }
        questionId: { type: string, format: uuid, nullable: true, description: "kind=question_published일 때만 채워짐 — 호당 질문 2개라 이걸로 어느 질문인지 구분(눌렀을 때 그 질문으로 이동)" }
        kind: { type: string, enum: [question_published, deadline_reminder, published, owner_changed] }
        readAt: { type: string, format: date-time, nullable: true, description: "NULL = 안 읽음" }
        sentAt: { type: string, format: date-time }

    UserBlock:
      type: object
      description: "개인 차단(SAFE-02). FamilyBlock(방장이 내보낸 '차단'과는 다른 기능)과 혼동 주의"
      properties:
        blockedUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    RecipientInput:
      type: object
      description: "수신자 한 명(RCV-01). 사진은 받지 않는다(1005 결정) — 앱 표기는 캐릭터(PRF-05)로 대체 예정이나 설계 미확정이라 아직 필드 없음"
      required: [name, gender]
      properties:
        name: { type: string }
        gender: { type: string, enum: [female, male], description: "호칭 결정에 필수" }

    Recipient:
      allOf:
        - $ref: "#/components/schemas/RecipientInput"
        - type: object
          properties:
            displayOrder: { type: integer, enum: [1, 2], description: "1인이면 1만, 부부면 1·2" }

    DeliveryAddressInput:
      type: object
      required: [recipients, postalCode, addressLine1, thirdPartyInfoConsented]
      properties:
        label: { type: string, example: "할머니 댁" }
        thirdPartyInfoConsented:
          type: boolean
          enum: [true]
          description: "제3자(수신자) 정보 입력 동의(RCV-03). 동의하지 않으면 가족방을 만들 수 없다 — 항목·목적·보관 기간 안내 후 [동의하기]"
        recipientType: { type: string, enum: [single, couple], default: single }
        recipients:
          type: array
          minItems: 1
          maxItems: 2
          description: "recipientType=single이면 1개, couple이면 2개(FAM-01: 두 분을 카드로 오가며 각각 입력)"
          items: { $ref: "#/components/schemas/RecipientInput" }
        recipientPhone: { type: string, nullable: true, description: "서버에 암호화 저장됨" }
        postalCode: { type: string }
        addressLine1: { type: string, description: "서버에 암호화 저장됨" }
        addressLine2: { type: string, nullable: true }
        memo: { type: string, nullable: true }

    DeliveryAddress:
      allOf:
        - $ref: "#/components/schemas/DeliveryAddressInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            groupId: { type: string, format: uuid }
            recipients:
              type: array
              items: { $ref: "#/components/schemas/Recipient" }
            createdBy: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }

    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        title: { type: string, example: "2026년 10월호" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        phase: { $ref: "#/components/schemas/IssuePhase", description: "운영자 전용 (AdminIssues/AdminCompose 응답에만 채움)" }
        displayState: { $ref: "#/components/schemas/DisplayState", description: "가족에게 보여줄 때 쓰는 값" }
        markers: { allOf: [{ $ref: "#/components/schemas/IssueMarkers" }], nullable: true, description: "운영자 전용" }
        latestRun:
          allOf: [{ $ref: "#/components/schemas/LayoutRunSummary" }]
          nullable: true
          description: "최신 조판 실행 요약 (운영자 전용, AdminIssues 상세/목록 응답에만 채움). 조판이 한 번도 돈 적 없으면 null"
        printJob:
          allOf: [{ $ref: "#/components/schemas/PrintJobSummary" }]
          nullable: true
          description: "최신 인쇄 작업 상태 (운영자 전용). 아직 안 만들어졌으면 null"
        closeAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          nullable: true
          description: "v_issue_progress 기반 진행률 요약"

    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string, nullable: true }
        questionId: { type: string, format: uuid, nullable: true }
        questionOption: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/Visibility" }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }

    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        storageKey: { type: string }
        width: { type: integer }
        height: { type: integer }
        pinned: { type: boolean }
        excluded: { type: boolean }
        createdAt: { type: string, format: date-time }

    Question:
      type: object
      properties:
        id: { type: string, format: uuid }
        appBody: { type: string, description: "앱 문구. 수신자 자리에 호칭 자동 삽입(TTL-01)" }
        kind: { type: string, enum: [binary, balance, multiple_choice, short_answer] }
        options:
          type: array
          items: { type: string }
          nullable: true
        target: { type: string, enum: [sender, recipient, us] }
        displayOrder: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        targetType: { type: string, enum: [post, comment, user] }
        targetId: { type: string, format: uuid }
        reason: { type: string }
        status: { type: string, enum: [pending, resolved] }
        resolvedBy: { type: string, format: uuid, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Operator:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }


    OperatorAlert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [layout_failed, report_received] }
        refType: { type: string, enum: [issue, report] }
        refId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }

    Metrics:
      type: object
      description: "평가 지표(M-01~M-13). 집계 단위는 groupId 쿼리 파라미터로 가족별/전체 전환"
      properties:
        memberCount: { type: integer, description: M-01 }
        postCount: { type: integer, description: M-02 }
        participantCount: { type: integer, description: M-04 }
        participationRate: { type: number, format: float, description: M-05 }
        commentCount: { type: integer, description: M-06 }
        questionOnlyParticipants: { type: integer, description: M-08 }
        recipientOnlyRate: { type: number, format: float, description: M-09 }
        reminderFollowUpCount: { type: integer, description: M-10 }
        newsletterViewerCount: { type: integer, description: M-12 }
        waitlistRate: { type: number, format: float, description: M-13 }
