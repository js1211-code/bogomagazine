openapi: 3.0.3
info:
  title: 보고매거진 API
  version: 0.1.0
  description: |
    가족이 올린 글/사진을 모아 월간 신문으로 만들어 인쇄·배송하는 서비스의 API.

    **이 문서는 조판 기술 엔진(자동 조판 생성·조판 워커·미리보기 렌더링)을 제외한 나머지 전부를 다룬다.**
    아래는 이 문서에 **없는** 것들이다 (다른 팀원 문서 참고):
    - 조판 생성/재생성 트리거, 조판 워커 claim/heartbeat/complete API
    - `layout_run`/`page`/`placement`/`preview` 리소스 자체의 CRUD
    - 조판 알고리즘의 입출력 (`docs/algorithm-io.md` 참고)

    운영자(조판 검수, override)·인쇄/배송(print_job, print_order)·알림 등은 **이 문서에 포함**된다 —
    조판 "엔진"이 아니라 그 결과를 다루는 운영/후처리 단계이기 때문이다.

    각 엔드포인트 설명에는 가능하면 기능명세서 코드(`FAM-01` 같은 것)를 같이 적었다. DB 설계는
    [architecture.md](architecture.md)/[erd.md](erd.md) 참고. 스키마와 이 문서가 다르면 **스키마가 기준**이다.

    ## 인증
    - 가족 사용자: 카카오/애플 로그인 후 발급되는 `Bearer` 토큰 (`userBearer`)
    - 운영자(Admin): 별도 로그인으로 발급되는 `Bearer` 토큰 (`operatorBearer`). 로그인 방식(사내 계정 체계) 자체는
      스펙에 구체적으로 정해지지 않아 이 문서에서는 이메일/비밀번호로 가정만 해뒀다 — 팀 확인 필요.

    ## 공통 규칙
    - 모든 시각은 ISO 8601(UTC, `Z` 표기), 날짜(`period_start` 등)는 `YYYY-MM-DD`.
    - 목록 응답은 `{ "items": [...], "nextCursor": "..." }` 형태의 커서 페이지네이션.
    - 삭제는 대부분 소프트 삭제(해당 리소스는 설명에 명시). DELETE 응답은 204.
    - 에러 응답은 전부 `Error` 스키마.

servers:
  - url: https://bogomagazine.example/api/v1
    description: 운영 (도메인 미정)
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

tags:
  - name: Auth
    description: 로그인/로그아웃/탈퇴 (ACC-01~05)
  - name: Me
    description: 내 프로필/동의/차단 (PRF-01, ACC-03, SAFE-02)
  - name: Devices
    description: 푸시 토큰
  - name: Notifications
    description: "알림 목록 (NOTI-01~06, 1004 결정)"
  - name: Waitlist
    description: 정식 출시 대기 신청 (WAIT-01)
  - name: Groups
    description: 가족 그룹 (FAM-01~04)
  - name: Members
    description: 구성원 (FAM-08~13)
  - name: Invites
    description: 카카오톡 초대 링크 (FAM-05~07)
  - name: DeliveryAddress
    description: 수신자 정보/배송지 (RCV-01~03)
  - name: Issues
    description: 호 상태/진행 (가족 쪽 읽기 전용, PUB-01)
  - name: Feed
    description: 글/사진 (POST-01~07)
  - name: Questions
    description: 질문카드 (QST-01~07)
  - name: Comments
    description: 답변 댓글 (QST-06)
  - name: Reports
    description: 신고 (SAFE-01)
  - name: Newsletter
    description: 발송된 신문 PDF 열람 (PUB-02, M-12)
  - name: AdminAuth
    description: 운영자 로그인
  - name: AdminIssues
    description: 운영자용 호 운영 (ADM-02)
  - name: AdminReview
    description: 조판 검수/수정 로그 (ADM-03) — 조판 "생성"은 제외, 결과에 대한 조치만
  - name: AdminPrinting
    description: 인쇄 작업/배송 주문 (ADM-04)
  - name: AdminReports
    description: 신고·차단 처리 (ADM-05)
  - name: AdminMetrics
    description: 평가 지표 (ADM-06)
  - name: AdminWaitlist
    description: 대기 신청 목록 (ADM-07)
  - name: AdminAlerts
    description: 운영 알림 (ADM-08)

security:
  - userBearer: []

paths:
  # ===================== Auth / Me =====================
  /auth/kakao:
    post:
      tags: [Auth]
      summary: 카카오 로그인 (ACC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kakaoAccessToken]
              properties:
                kakaoAccessToken: { type: string }
                inviteToken: { type: string, description: "초대 링크로 들어온 경우(FAM-07)" }
                consent:
                  $ref: "#/components/schemas/SignupConsent"
      responses:
        "200":
          description: 로그인 성공 (최초 로그인이면 가입도 함께 처리됨)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: 최초 가입인데 필수 동의(consent)가 빠짐(ACC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/apple:
    post:
      tags: [Auth]
      summary: 애플 로그인 (ACC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appleIdentityToken]
              properties:
                appleIdentityToken: { type: string }
                name: { type: string, description: "애플은 최초 로그인 때만 제공" }
                inviteToken: { type: string }
                consent:
                  $ref: "#/components/schemas/SignupConsent"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: 최초 가입인데 필수 동의(consent)가 빠짐(ACC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃 (ACC-04)
      responses:
        "204": { description: 로그아웃됨 }

  /me:
    get:
      tags: [Me]
      summary: 내 프로필 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Me]
      summary: 내 프로필 수정 (PRF-01)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                photoKey: { type: string }
                birthMonth: { type: integer, minimum: 1, maximum: 12 }
                birthDay: { type: integer, minimum: 1, maximum: 31 }
                researchConsented: { type: boolean, description: "연구·발표 활용 동의(선택, ACC-03)" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Me]
      summary: 회원 탈퇴 (ACC-05)
      description: |
        신원/인증 정보를 익명화한다. 모집 중인 호의 글은 삭제되고, 마감 이후 호의 글은 유지된다.
        방장이면 다른 활동 중인 구성원에게 자동으로 방장이 넘어간다(FAM-11). 혼자뿐인 그룹의 방장은
        아직 거부된다(정책 미정, TODO.md "결정 대기").
      responses:
        "204": { description: 탈퇴 완료 }
        "409":
          description: 혼자뿐인 그룹의 방장이라 탈퇴 불가
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/devices:
    post:
      tags: [Devices]
      summary: 푸시 토큰 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                platform: { type: string, enum: [ios, android] }
                pushToken: { type: string }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }

  /me/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: 푸시 토큰 해지 (로그아웃/재설치 시)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { description: 해지됨 }

  /me/notifications:
    get:
      tags: [Notifications]
      summary: "알림 목록 (NOTI-06, 1004 결정)"
      description: |
        소속된 모든 가족의 알림을 가족 이름과 함께 시간순으로 보여준다. 종류: 질문 공개(NOTI-01)·
        마감 리마인더(NOTI-02)·발송 완료(NOTI-03)·방장 변경(FAM-11). 60일 지나면 자동 삭제된다(O-33).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /me/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: "알림 읽음 표시 (NOTI-06)"
      description: 목록을 열면 안 읽은 항목의 배경색이 사라진다.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: 읽음 표시됨 }

  /me/blocks:
    get:
      tags: [Me]
      summary: "내가 차단한 사람 목록 (SAFE-02, HOME-04 설정 화면)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserBlock" }

  /users/{userId}/block:
    post:
      tags: [Me]
      summary: 개인 차단 (SAFE-02)
      description: 차단하면 내 화면에서 그 사람 콘텐츠가 숨겨지고, 자동으로 팀에 신고가 쌓인다. 상대에게 알림 없음.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 차단됨 }
        "409":
          description: 자기 자신을 차단하려 함 / 이미 차단함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Me]
      summary: "개인 차단 해제 (SAFE-02, 설정 '내가 차단한 사람', 1004 결정)"
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 해제됨 }

  /waitlist:
    post:
      tags: [Waitlist]
      summary: 정식 출시 대기 신청 (WAIT-01)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, default: "WAIT-01" }
      responses:
        "201": { description: 신청됨 }
        "409": { description: 같은 코드로 이미 신청함 }

  # ===================== Groups / Members / Invites =====================
  /groups:
    get:
      tags: [Groups]
      summary: 내가 속한 가족 그룹 목록 (FAM-04)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyGroup" }
    post:
      tags: [Groups]
      summary: 가족 그룹 만들기 (FAM-01)
      description: |
        만든 사람이 방장이 된다. 그룹 이름(FAM-02), 내 관계(PRF-02), 수신자 정보(RCV-01),
        배송지(RCV-02)를 한 번에 입력한다. 신문 제호(FAM-03)는 기본값 '보고잡지'.

        **중복 생성 방지(1005 결정, 프로토타입 수준)**: 같은 사람이 방금(수 초 이내) 같은 이름으로
        만든 가족방이 있으면 새로 만들지 않고 그 가족방을 그대로 반환한다(200). 네트워크 오류로
        [다시 시도]를 눌러도 가족방이 중복 생성되지 않게 하려는 것 — 요청이 느려지거나 응답을 못
        받아도 안전하게 재시도할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, relationship, deliveryAddress]
              properties:
                name: { type: string, description: "그룹 이름(FAM-02)" }
                newsletterTitle: { type: string, default: "보고잡지", description: "신문 제호(FAM-03)" }
                relationship: { $ref: "#/components/schemas/Relationship" }
                deliveryAddress: { $ref: "#/components/schemas/DeliveryAddressInput" }
      responses:
        "200":
          description: 방금 같은 내용으로 만든 가족방이 이미 있어 그걸 그대로 반환함 (중복 생성 방지)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
        "201":
          description: 새로 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: 그룹 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
    patch:
      tags: [Groups]
      summary: 그룹 이름/제호 수정 (FAM-02, FAM-03)
      description: "제호 변경 권한은 아직 미결(O-14) — 지금은 구성원 누구나 가능."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                newsletterTitle: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }

  /groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Members]
      summary: 구성원 목록 (FAM-13)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyMember" }

  /groups/{groupId}/members/me:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    patch:
      tags: [Members]
      summary: 내 관계(호칭) 수정 (PRF-02)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [relationship]
              properties:
                relationship: { $ref: "#/components/schemas/Relationship" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMember" }

  /groups/{groupId}/members/{userId}:
    delete:
      tags: [Members]
      summary: 구성원 내보내기 (FAM-09, 방장만)
      description: 내보낸 계정은 자동으로 차단 목록에 등록된다. 방장은 내보낼 수 없다.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 내보냄 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 방장을 내보내려 함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/blocks:
    get:
      tags: [Members]
      summary: 차단 목록 (FAM-09/10, 방장만)
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilyBlock" }

  /groups/{groupId}/blocks/{userId}/unblock:
    post:
      tags: [Members]
      summary: 차단 해제 (FAM-10, 방장만)
      description: 해제하면 같은 초대 링크로 다시 합류 가능.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 해제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/invites:
    post:
      tags: [Invites]
      summary: 초대 링크 생성 (FAM-05, 방장만)
      description: |
        유효기간·사용 횟수 제한·취소가 없는 영구 링크다. **가족마다 고정 코드 1개**(1004 결정) —
        이미 있으면 새로 만들지 않고 그 링크를 그대로 돌려준다(200). 처음 만들 때만 201.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: 이미 있던 링크를 그대로 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl: { type: string, format: uri }
        "201":
          description: 새로 생성됨 (카카오톡 공유용 URL 포함)
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl: { type: string, format: uri }

  /invites/{token}:
    get:
      tags: [Invites]
      summary: "초대 링크 미리 확인 (FAM-07 \"우리 가족 확인\")"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 수신자 이름과 참여 중인 가족 프로필
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupName: { type: string }
                  recipientNames: { type: array, items: { type: string }, description: "1인이면 1개, 부부면 2개" }
                  memberCount: { type: integer }
        "403":
          description: 차단된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invites/{token}/accept:
    post:
      tags: [Invites]
      summary: 초대 수락 (FAM-05~07)
      description: 이미 활동 중인 구성원이면 그대로 합류 처리, 나갔던 구성원이면 재합류. 항상 일반 구성원.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 합류됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyGroup" }
        "403":
          description: 차단된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/delivery-address:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [DeliveryAddress]
      summary: 수신자 정보/배송지 조회 (RCV-01/02, 방장만)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }
    put:
      tags: [DeliveryAddress]
      summary: 수신자 정보/배송지 등록·수정 (RCV-01/02, 방장만)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryAddressInput" }
      responses:
        "200":
          description: 저장됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }

  # ===================== Issues (family-facing, read-only) =====================
  /groups/{groupId}/issues:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Issues]
      summary: 호 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }

  /groups/{groupId}/issues/current:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Issues]
      summary: "이번 호 상태/진행 (HOME-01 D-day, PUB-01)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}:
    get:
      tags: [Issues]
      summary: 호 상세
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  # ===================== Feed =====================
  /groups/{groupId}/feed:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Feed]
      summary: 피드 조회 (HOME-02/03, 시간순)
      description: |
        '할머니께만' 게시물은 작성자 외 다른 구성원에게는 보이지 않는다.
        issueId를 생략하면 이번 호, 지정하면 지난 호를 읽기 전용으로 조회한다(HOME-03, 1004 결정).
      parameters:
        - name: issueId
          in: query
          schema: { type: string, format: uuid }
          description: "생략하면 이번 호. 지난 호 지정 시 읽기 전용(HOME-03)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }

  /groups/{groupId}/posts:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    post:
      tags: [Feed]
      summary: 글 작성 (POST-01)
      description: 마감된 기간에는 거부된다. 작성자는 그 그룹의 활동 중인 구성원이어야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "422":
          description: 마감된 기간 / 금칙어 포함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Feed]
      summary: 글 상세
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
    patch:
      tags: [Feed]
      summary: 글 수정 (POST-06, 본인만·마감 전까지만)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 수정 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Feed]
      summary: 글 삭제 (POST-06, 본인만·마감 전까지만, 소프트 삭제)
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 삭제 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /posts/{postId}/media:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Feed]
      summary: 사진 첨부 (POST-05)
      description: presigned URL로 직접 업로드한 뒤 그 storage key를 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storageKey, sha256, width, height]
              properties:
                storageKey: { type: string }
                sha256: { type: string }
                width: { type: integer }
                height: { type: integer }
                takenAt: { type: string, format: date-time }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }

  /media/{mediaId}/upload-url:
    post:
      tags: [Feed]
      summary: 사진 업로드용 presigned URL 발급 (NFR-03)
      parameters:
        - name: mediaId
          in: path
          required: true
          description: 클라이언트가 미리 생성한 ID (업로드 후 /posts/{postId}/media 등록에 사용)
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }

  /media/{mediaId}:
    delete:
      tags: [Feed]
      summary: 사진 삭제 (NFR-11 소프트 삭제, 그 글의 작성자만·마감 전까지만)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: 마감 후 삭제 시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===================== Questions / Comments / Reports =====================
  /groups/{groupId}/questions/current:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    get:
      tags: [Questions]
      summary: 이번 호에 공개된 질문 목록 (QST-01, 보통 2개)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }

  /groups/{groupId}/answers:
    parameters: [{ $ref: "#/components/parameters/GroupId" }]
    post:
      tags: [Questions]
      summary: 질문 답변 작성 (QST-03)
      description: 1인당 질문당 답변 1개(삭제되지 않은 것만).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId]
              properties:
                questionId: { type: string, format: uuid }
                questionOption: { type: string, description: "선택형 질문의 선택지. 주관식은 생략" }
                body: { type: string, description: "한 줄 덧붙이기(선택) 또는 주관식 답" }
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "409": { description: 이미 답변함 }

  /questions/{questionId}/answers:
    get:
      tags: [Questions]
      summary: 그 질문에 대한 가족 답변 목록 (QST-05)
      description: |
        내가 답변하지 않았으면 답변 내용은 숨기고, 누가 답했고 누가 아직 안 했는지만 보여준다
        (1005 결정 — 식탁 그림 컨셉, 구성원을 캐릭터로 구분해 표시. 캐릭터 필드는 설계 미확정이라
        아직 응답에 없음). '할머니께만' 답변과 내가 개인 차단(SAFE-02)한 사람은 두 목록 모두에서
        제외된다. 독촉 의도의 알림은 보내지 않는다(NOTI-04).
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      answered: { type: boolean, enum: [false] }
                      respondedMembers:
                        type: array
                        items: { $ref: "#/components/schemas/MemberSummary" }
                      pendingMembers:
                        type: array
                        items: { $ref: "#/components/schemas/MemberSummary" }
                  - type: object
                    properties:
                      answered: { type: boolean, enum: [true] }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Post" }

  /posts/{postId}/comments:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Comments]
      summary: 답변 댓글 작성 (QST-06)
      description: 질문 답변에만 허용(자유 게시물 거부). 마감 후 불가.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "422":
          description: 자유 게시물에 댓글 시도 / 마감 후
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Comments]
      summary: 댓글 수정 (QST-06, 본인만·마감 전까지만)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Comments]
      summary: 댓글 삭제 (QST-06, 본인만·마감 전까지만, 소프트 삭제)
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports:
    post:
      tags: [Reports]
      summary: 콘텐츠 신고 (SAFE-01)
      description: 신고한 사람 화면에서는 즉시 숨김 처리(클라이언트에서 처리).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [post, comment] }
                targetId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "201":
          description: 접수됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  # ===================== Newsletter (발송 후 열람) =====================
  /issues/{issueId}/newsletter:
    get:
      tags: [Newsletter]
      summary: 발송 완료된 신문의 열람용 페이지 이미지 목록 (PUB-02, NEWS-01, 1004 결정)
      description: |
        인쇄용 PDF가 아니라 서버가 따로 만든 **열람용 페이지 이미지**(면마다 1장, '할머니께만' 블러를
        서버에서 입힌 것)를 돌려준다. 앱은 이 이미지를 책처럼 한 면씩 넘겨 보여준다(리플로우 없음,
        종이 지면과 같은 모양). 발송 완료 전에는 404. 다운로드·공유는 제공하지 않는다(앱 안에서만 보기).
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    description: "pageNo 순서대로"
                    items:
                      type: object
                      properties:
                        pageNo: { type: integer }
                        imageUrl: { type: string, format: uri, description: "만료되는 서명 URL(NFR-08)" }
        "404": { description: 아직 발송 전 }

  /issues/{issueId}/newsletter/view:
    post:
      tags: [Newsletter]
      summary: 신문 PDF 열람 기록 (M-12)
      description: 열 때마다 기록이 쌓인다(멱등 아님).
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "201": { description: 기록됨 }

  # ===================== Admin =====================
  /admin/auth/login:
    post:
      tags: [AdminAuth]
      summary: 운영자 로그인
      description: "인증 방식은 스펙에 구체적으로 정해지지 않음 — 이메일/비밀번호로 가정만 해둠(팀 확인 필요)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  operator: { $ref: "#/components/schemas/Operator" }

  /admin/me:
    get:
      tags: [AdminAuth]
      summary: 현재 운영자 정보
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }

  /admin/issues:
    get:
      tags: [AdminIssues]
      summary: 전체 가족의 호 상태 목록 (ADM-02)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IssueStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Issue" }

  /admin/issues/{issueId}/status:
    patch:
      tags: [AdminIssues]
      summary: "호 상태를 '발송 완료'로 수동 전환 (ADM-02)"
      description: |
        모집 마감·신문 만드는 중은 자동 전환되고, '발송 완료'만 운영자가 수동으로 전환한다.
        전환하면 가족 전원에게 발송완료 푸시가 간다(NOTI-03).
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [printed] }
      responses:
        "200":
          description: 전환됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "422":
          description: 전이 사전조건 미충족(인쇄 작업 없음 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/issues/{issueId}/overrides:
    parameters: [{ $ref: "#/components/parameters/IssueId" }]
    get:
      tags: [AdminReview]
      summary: 조판 수정 로그 조회 (ADM-03)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Override" }
    post:
      tags: [AdminReview]
      summary: "조판 검수 중 수정 생성 (ADM-03, 게시물 제외·재조판 등)"
      description: |
        review 상태에서만 허용된다. 조판을 다시 만드는 실제 처리(재조판 큐 적재 등)는
        조판 엔진 쪽 API가 담당 — 여기서는 "무엇을 어떻게 고칠지"의 기록(override)만 남긴다.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, op]
              properties:
                targetType: { type: string, enum: [page, placement, media] }
                targetId: { type: string, format: uuid }
                op:
                  type: object
                  description: "move/resize/swap/crop/pin/exclude 등 수정 내용"
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Override" }
        "422":
          description: review 상태가 아니거나 무효화된 조판
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/pages/{pageId}/lock:
    parameters:
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AdminReview]
      summary: 페이지 편집 락 획득
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageLock" }
        "409": { description: 다른 사람이 편집 중 }
    delete:
      tags: [AdminReview]
      summary: 페이지 편집 락 해제
      security: [{ operatorBearer: [] }]
      responses:
        "204": { description: 해제됨 }

  /admin/issues/{issueId}/print-job:
    get:
      tags: [AdminPrinting]
      summary: 인쇄용 PDF 작업 상태 (ADM-04)
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintJob" }

  /admin/print-jobs/{jobId}/download:
    get:
      tags: [AdminPrinting]
      summary: 인쇄용 PDF 다운로드 URL (ADM-04, 인쇄소 전달용)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl: { type: string, format: uri }

  /admin/issues/{issueId}/print-orders:
    get:
      tags: [AdminPrinting]
      summary: 호별 배송 주문 목록 (ADM-04)
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PrintOrder" }

  /admin/issues/{issueId}/print-orders/export:
    get:
      tags: [AdminPrinting]
      summary: 배송지 목록 엑셀 다운로드 (ADM-04, 팀이 직접 우편 발송)
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IssueId" }]
      responses:
        "200":
          description: xlsx 파일
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /admin/print-orders/{orderId}:
    patch:
      tags: [AdminPrinting]
      summary: 배송 주문 상태 갱신 (운영팀 내부 추적용)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/PrintOrderStatus" }
                tracking: { type: string }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintOrder" }

  /admin/reports:
    get:
      tags: [AdminReports]
      summary: 신고 목록 (ADM-05)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }

  /admin/reports/{reportId}:
    patch:
      tags: [AdminReports]
      summary: 신고 처리 (ADM-05, 24시간 안 대응)
      description: 처리하면 신고된 게시물/답변/댓글을 숨긴다.
      security: [{ operatorBearer: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved] }
                hideContent: { type: boolean, default: true }
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /admin/delivery-addresses/{groupId}:
    get:
      tags: [AdminReports]
      summary: 배송지 열람 (ADM-01)
      description: 열람·다운로드 기록이 남는다(delivery_address_access_log).
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }

  /admin/waitlist:
    get:
      tags: [AdminWaitlist]
      summary: 대기 신청 목록/수 (ADM-07)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        code: { type: string }
                        createdAt: { type: string, format: date-time }

  /admin/alerts:
    get:
      tags: [AdminAlerts]
      summary: 운영 알림 목록 (ADM-08)
      description: 신고 접수는 즉시, 조판 실패는 3번째 실패에서만 쌓인다.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorAlert" }

  /admin/metrics:
    get:
      tags: [AdminMetrics]
      summary: 평가 지표 (ADM-06, M-01~M-13)
      security: [{ operatorBearer: [] }]
      parameters:
        - name: groupId
          in: query
          schema: { type: string, format: uuid }
          description: 생략하면 전체 집계
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }

  /admin/metrics/export:
    get:
      tags: [AdminMetrics]
      summary: 평가 지표 엑셀 내보내기 (ADM-06)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: xlsx 파일
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 없음 (본인/방장만 가능한 동작)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: "PERIOD_CLOSED" }
        message: { type: string }

    Relationship:
      type: string
      enum: [손녀, 손자, 딸, 아들, 며느리, 사위, 손주며느리, 손주사위]
      description: "호칭 대응표(TTL-01~04) 8개 값. 외가 구분 없음"

    Visibility:
      type: string
      enum: [all, recipient_only]
      default: all
      description: "POST-02. recipient_only = '할머니께만'"

    IssueStatus:
      type: string
      enum: [collecting, closing, review, printing, printed, skipped, archived]
      description: "가족에게는 모집 중/모집 마감/신문 만드는 중/발송 완료 4단계로 단순화해서 보여준다(PUB-01)."

    PrintOrderStatus:
      type: string
      enum: [pending, confirmed, printing, shipped, delivered, cancelled]

    SignupConsent:
      type: object
      description: |
        가입 동의(ACC-03). **최초 가입(isNewUser=true)일 때만 필수**다 — 이미 가입된 사용자가
        로그인할 때는 무시된다. 만 14세 미만이면 ageOver14Confirmed를 보낼 수 없게 앱이 막아야 한다
        (가입 자체를 차단).
      required: [privacyConsented, termsConsented, ageOver14Confirmed]
      properties:
        privacyConsented: { type: boolean, enum: [true], description: 개인정보 수집·이용 동의 }
        termsConsented: { type: boolean, enum: [true], description: "이용약관(불쾌한 콘텐츠·악용 사용자 무관용 조항) 동의" }
        ageOver14Confirmed: { type: boolean, enum: [true], description: 만 14세 이상 확인 }
        researchConsented: { type: boolean, default: false, description: "연구·발표 활용 동의(선택)" }

    AuthResult:
      type: object
      properties:
        accessToken: { type: string }
        isNewUser: { type: boolean }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        photoKey: { type: string, nullable: true }
        birthMonth: { type: integer, nullable: true }
        birthDay: { type: integer, nullable: true }
        privacyConsentedAt: { type: string, format: date-time }
        termsConsentedAt: { type: string, format: date-time }
        ageOver14ConfirmedAt: { type: string, format: date-time }
        researchConsentedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        createdAt: { type: string, format: date-time }

    FamilyGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        newsletterTitle: { type: string }
        ownerId: { type: string, format: uuid }
        closeDay: { type: integer, minimum: 1, maximum: 28 }
        timezone: { type: string, default: "Asia/Seoul" }
        createdAt: { type: string, format: date-time }

    FamilyMember:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        relationship: { $ref: "#/components/schemas/Relationship" }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }

    MemberSummary:
      type: object
      description: "QST-05 답변 전 식탁 그림 등 가벼운 목록에 쓰는 요약 정보. 캐릭터(PRF-05)는 설계 미확정이라 아직 없음"
      properties:
        userId: { type: string, format: uuid }
        nickname: { type: string, nullable: true }

    FamilyBlock:
      type: object
      properties:
        userId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: string, format: uuid, nullable: true, description: "방장 변경처럼 호와 무관한 알림도 있다" }
        issueId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [question_published, deadline_reminder, published, owner_changed] }
        readAt: { type: string, format: date-time, nullable: true, description: "NULL = 안 읽음" }
        sentAt: { type: string, format: date-time }

    UserBlock:
      type: object
      description: "개인 차단(SAFE-02). FamilyBlock(방장이 내보낸 '차단'과는 다른 기능)과 혼동 주의"
      properties:
        blockedUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    RecipientInput:
      type: object
      description: "수신자 한 명(RCV-01). 사진은 받지 않는다(1005 결정) — 앱 표기는 캐릭터(PRF-05)로 대체 예정이나 설계 미확정이라 아직 필드 없음"
      required: [name, gender]
      properties:
        name: { type: string }
        gender: { type: string, enum: [female, male], description: "호칭 결정에 필수" }

    Recipient:
      allOf:
        - $ref: "#/components/schemas/RecipientInput"
        - type: object
          properties:
            displayOrder: { type: integer, enum: [1, 2], description: "1인이면 1만, 부부면 1·2" }

    DeliveryAddressInput:
      type: object
      required: [recipients, postalCode, addressLine1]
      properties:
        label: { type: string, example: "할머니 댁" }
        recipientType: { type: string, enum: [single, couple], default: single }
        recipients:
          type: array
          minItems: 1
          maxItems: 2
          description: "recipientType=single이면 1개, couple이면 2개(FAM-01: 두 분을 카드로 오가며 각각 입력)"
          items: { $ref: "#/components/schemas/RecipientInput" }
        recipientPhone: { type: string, nullable: true, description: "서버에 암호화 저장됨" }
        postalCode: { type: string }
        addressLine1: { type: string, description: "서버에 암호화 저장됨" }
        addressLine2: { type: string, nullable: true }
        memo: { type: string, nullable: true }

    DeliveryAddress:
      allOf:
        - $ref: "#/components/schemas/DeliveryAddressInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            groupId: { type: string, format: uuid }
            recipients:
              type: array
              items: { $ref: "#/components/schemas/Recipient" }
            createdBy: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }

    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        title: { type: string, example: "2026년 10월호" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        status: { $ref: "#/components/schemas/IssueStatus" }
        closeAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          nullable: true
          description: "v_issue_progress 기반 진행률 요약"

    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string, nullable: true }
        questionId: { type: string, format: uuid, nullable: true }
        questionOption: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/Visibility" }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }

    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        storageKey: { type: string }
        width: { type: integer }
        height: { type: integer }
        pinned: { type: boolean }
        excluded: { type: boolean }
        createdAt: { type: string, format: date-time }

    Question:
      type: object
      properties:
        id: { type: string, format: uuid }
        appBody: { type: string, description: "앱 문구. 수신자 자리에 호칭 자동 삽입(TTL-01)" }
        kind: { type: string, enum: [binary, balance, multiple_choice, short_answer] }
        options:
          type: array
          items: { type: string }
          nullable: true
        target: { type: string, enum: [sender, recipient, us] }
        displayOrder: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        targetType: { type: string, enum: [post, comment, user] }
        targetId: { type: string, format: uuid }
        reason: { type: string }
        status: { type: string, enum: [pending, resolved] }
        resolvedBy: { type: string, format: uuid, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Operator:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }

    Override:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        targetType: { type: string, enum: [page, placement, media] }
        targetId: { type: string, format: uuid }
        op: { type: object }
        authorId: { type: string, format: uuid, nullable: true, description: "가족이 만든 수정(현재 스펙상 사용 안 함)" }
        operatorId: { type: string, format: uuid, nullable: true, description: "운영자가 만든 수정(ADM-03)" }
        createdAt: { type: string, format: date-time }

    PageLock:
      type: object
      properties:
        pageId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    PrintJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        status: { type: string, enum: [queued, rendering, preflight_failed, ready, failed] }
        pdfKey: { type: string, nullable: true }
        preflightReport: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }

    PrintOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        printJobId: { type: string, format: uuid }
        recipientName: { type: string }
        postalCode: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/PrintOrderStatus" }
        tracking: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    OperatorAlert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [layout_failed, report_received] }
        refType: { type: string, enum: [issue, report] }
        refId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }

    Metrics:
      type: object
      description: "평가 지표(M-01~M-13). 집계 단위는 groupId 쿼리 파라미터로 가족별/전체 전환"
      properties:
        memberCount: { type: integer, description: M-01 }
        postCount: { type: integer, description: M-02 }
        participantCount: { type: integer, description: M-04 }
        participationRate: { type: number, format: float, description: M-05 }
        commentCount: { type: integer, description: M-06 }
        questionOnlyParticipants: { type: integer, description: M-08 }
        recipientOnlyRate: { type: number, format: float, description: M-09 }
        reminderFollowUpCount: { type: integer, description: M-10 }
        newsletterViewerCount: { type: integer, description: M-12 }
        waitlistRate: { type: number, format: float, description: M-13 }
